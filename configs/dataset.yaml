# configs/dataset.yaml
files:
  benign: "benign.csv"
  attacks_dir: "attacks"

schema:
  identifiers:
    - "flow_id"
    - "timestamp"
  targets:
    - "label"
    - "label_encoded"
  features:
    ttl:
      - "ttl_values_mean"
      - "ttl_values_median"
      - "ttl_values_mode"
      - "ttl_values_min"
      - "ttl_values_max"
    packet:
      - "packets_rate"
      - "packets_len_rate"
      - "min_packets_len"
      - "mean_packets_len"
      - "variance_packets_len"
      - "standard_deviation_packets_len"
      - "coefficient_of_variation_packets_len"
    flow:
      - "duration"
      - "sending_bytes"
      - "total_bytes"
    dns:
      - "dns_domain_name_length"
      - "dns_subdomain_name_length"
      - "distinct_A_records"
    lexical:
      - "character_entropy"
      - "numerical_percentage"
      - "conv_freq_vowels_consonants"
      - "max_continuous_consonants_len"
      - "max_continuous_numeric_len"